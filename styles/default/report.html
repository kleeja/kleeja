<!-- Report template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{title}</h1>
    <!-- @end-title -->

    <IF NAME="ERRORS">
    <!-- msg, Alerts & Errors -->
    <div class="notice notice-error" role="alert">
        <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
        <ul class="notice-body">
            <LOOP NAME="ERRORS">
            <li>{%value%}</li>
            </LOOP>
        </ul>
    </div>
    <!-- @end-msg -->
    </IF>

    <div class="form-layout">
        <!-- Report Form -->
        <form class="form-main" action="{action}" method="post">

            <IF NAME="NOT_USER">
            <div class="form-grid-2">
                <div class="field">
                    <label for="rname">{lang.YOURNAME}</label>
                    <input class="input-username" type="text" id="rname" name="rname" value="{t_rname}" autocomplete="name">
                </div>
                <div class="field">
                    <label for="rmail">{lang.EMAIL}</label>
                    <input type="email" id="rmail" name="rmail" value="{t_rmail}" dir="ltr" autocomplete="email">
                </div>
            </div>
            </IF>

            <IF NAME="id_d">
            <div class="field">
                <label for="rurl">{lang.FILENAME}</label>
                <input type="text" id="rurl" name="rurl" value="{filename_for_show}" readonly dir="auto">
            </div>
            <ELSE>
            <div class="field">
                <label for="surl">{lang.URL_F_FILE}</label>
                <input type="text" inputmode="url" id="surl" name="surl" value="{s_url}" dir="ltr" placeholder="https://">
            </div>
            </IF>

            <div class="field">
                <label for="rtext">{lang.REASON}</label>
                <textarea id="rtext" name="rtext" rows="4">{t_rtext}</textarea>
            </div>

            <IF NAME="config.enable_captcha==1">
            <!-- verification code -->
            <div class="safe_code">
                <label class="label" for="kleeja_code_answer">{lang.VERTY_CODE}</label>
                <div class="captcha">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}">
                    <button type="button" class="btn btn-icon" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" autocomplete="off" autocapitalize="off" spellcheck="false">
                </div>
                <p class="explain">{lang.NOTE_CODE}</p>
            </div>
            <!-- @end-verification-code -->
            </IF>

            <IF NAME="id_d">
            <input type="hidden" name="rid" value="{id_d}">
            </IF>

            {H_FORM_KEYS}

            <div class="form-actions">
                <button type="submit" name="submit" value="{lang.REPORT}" class="btn btn-danger btn-lg">{lang.REPORT}</button>
            </div>
        </form>
        <!-- @end-Report-Form -->

        <img class="page-art" src="{STYLE_PATH}images/file_rebort.gif" width="128" height="128" alt="">
    </div>

</div>
<!-- @end-Report-template -->
