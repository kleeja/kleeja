<!-- Errors template -->
<div id="content_index">
    <div class="notice notice-error message" role="alert">
        <img src="{STYLE_PATH}images/error.png" width="29" height="29" alt="">
        <div class="notice-body">
            <IF NAME="title"><h1 class="message-title">{title}</h1></IF>
            <div>{text}</div>
            <p class="message-actions"><a href="javascript:history.go(-1)">{go_back_browser}</a></p>
        </div>
    </div>
</div>
<!-- @end-Errors-template -->
