<!-- Download template -->
<div id="content">

    <!-- title -->
    <h1 class="title" dir="auto">{name}</h1>
    <!-- @end-title -->

    <div class="download-layout">

        <!-- Information File -->
        <div class="data_file box">
            <div class="box-title">{lang.FILE_INFO}</div>
            <table class="data_menu">
                <tr>
                    <th scope="row">{lang.FILENAME}</th>
                    <td dir="auto">{name}</td>
                </tr>
                <tr>
                    <th scope="row">{lang.FILETYPE}</th>
                    <td>{type}</td>
                </tr>
                <tr>
                    <th scope="row">{lang.FILESIZE}</th>
                    <td><bdi>{size}</bdi></td>
                </tr>
                <tr>
                    <th scope="row">{lang.FILEDATE}</th>
                    <td>{time}</td>
                </tr>
                <tr>
                    <th scope="row">{lang.FILEUPS}</th>
                    <td>{uploads}</td>
                </tr>
                <IF NAME="fusername">
                <tr>
                    <th scope="row">{lang.USERNAME}</th>
                    <td><a href="{userfolder}">{fusername}</a></td>
                </tr>
                </IF>
            </table>
            <a class="filereport" href="{REPORT}" rel="nofollow"><img src="{STYLE_PATH}images/zl.png" width="19" height="19" alt="">{lang.FILEREPORT}</a>
        </div>
        <!-- @end-Information-File -->

        <!-- box File, js/script.js counts down then shows the link -->
        <div class="data_file_down" data-download data-seconds="{seconds_w}">
            <p class="find_x">{lang.FILE_FOUNDED}</p>
            <img src="{STYLE_PATH}images/download.png" width="80" height="80" alt="">

            <div class="wait" data-download-wait>
                {lang.WAIT} <span class="wait-count" role="timer" data-download-count>{seconds_w}</span>
            </div>

            <p class="download" data-download-button hidden>
                <a class="btn-download" href="{url_file}" target="_blank" rel="nofollow">
                    <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>{lang.CLICK_DOWN}
                </a>
                <span><bdi>{size}</bdi></span>
            </p>

            <noscript><p class="notice notice-error">{lang.JS_MUST_ON}</p></noscript>
        </div>
        <!-- @end-box-File -->

    </div>
</div>
<!-- @end-Downlod-template -->
