<!DOCTYPE html>
<html lang="{lang.LANG_SMALL_NAME}" dir="{dir}">
<!-- Powered by kleeja || URL www.kleeja.net -->
<head>
    <meta charset="{charset}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="copyrights" content="Powered by Kleeja || kleeja.net">
    <meta name="theme-color" content="#ECECEC">
    <title>{title}(title? - :){config.sitename}</title>

    <link rel="shortcut icon" href="{config.siteurl}images/favicon.ico">
    <link rel="icon" type="image/png" href="{config.siteurl}images/favicon.png">
    <link rel="apple-touch-icon" href="{config.siteurl}images/apple-touch-icon.png">

    <link rel="stylesheet" href="{STYLE_PATH}css/stylesheet.css">

    <script>
        var STYLE_PATH = "{STYLE_PATH}";
        var LANG_PAST_URL_HERE = "{lang.PAST_URL_HERE}";
        var LANG_MORE_F_FILES = "{lang.MORE_F_FILES}";
        var number_of_uploads = parseInt("{config.filesnum}", 10) || 0;
    </script>

    <!-- Extra code -->
    {EXTRA_CODE_META}
</head>
<body data-page="{go_current}">
<INCLUDE NAME="icons">

<!-- begin Main -->
<div id="main">

    <!-- begin Header -->
    <header id="header">
        <a class="logo" href="{config.siteurl}" title="{config.sitename}">
            <img src="{STYLE_PATH}images/logo.png" alt="{config.sitename}" width="216" height="72">
        </a>
    </header>
    <!-- @end-Header -->

    <!-- begin Top Navigation -->
    <nav class="top_nav" aria-label="{lang.MENU}">
        <ul class="menu">
            <LOOP NAME="top_menu">
                <IF LOOP="show">
                <li><a href="{{url}}"(go_current=={{name}}? class="current" aria-current="page":)>{{title}}</a></li>
                </IF>
            </LOOP>
        </ul>
    </nav>
    <!-- @end-Top-Navigation -->

    <!-- begin wrapper -->
    <div id="wrapper">

        <!-- begin sidebar: the user and the user menu -->
        <aside id="sidebar">
            <div id="sidebar_box">
                <div class="user-card">
                    <!-- gravatar sends a missing avatar through its proxy, which fails for sites it can not reach -->
                    <img class="user-avatar" src="{user_avatar}" alt="" width="92" height="92" onerror="this.onerror=null;this.src='{STYLE_PATH}images/user_avater.png';">
                    <div class="user-hello">
                        <span class="user-greeting"><img src="{STYLE_PATH}images/Smile.png" width="16" height="16" alt="">{lang.WELCOME}</span>
                        <span class="user-name">{username}</span>
                    </div>
                </div>
                <ul class="menu side-menu">
                    <LOOP NAME="side_menu">
                        <IF LOOP="show">
                        <li><a href="{{url}}" title="{{title}}"(go_current=={{name}}? class="current":)><img src="{STYLE_PATH}images/{{name}}.png" alt="" width="16" height="16" onerror="this.style.visibility='hidden'"><span class="side-label">{{title}}</span></a></li>
                        </IF>
                    </LOOP>
                </ul>
            </div>
            <div class="sidebar-dots"></div>
        </aside>
        <!-- @end-sidebar -->

        <div class="content-area">

        <IF NAME="extras.header">
            <!-- begin extras header -->
            <div class="extras_header">{extras.header}</div>
            <!-- @end-extras-header -->
        </IF>
