<!--
    Upload result boxes, filled by get_up_tpl_box() in includes/functions_display.php
    Line breaks and the indent after them are removed before use, so keep every tag on one line.
    Only the b_ variables, siteurl and sitename are replaced here, lang variables are not;
    js/script.js gives the copy buttons their title.
-->

<!-- BEGIN image_thumb -->
    <div class="thumb_img"><a target="_blank" rel="noopener" href="{b_url_link}"><img src="{b_img_link}" alt="" loading="lazy"></a></div>
    <div class="up_box_row"><div class="btitle">{b_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="[url={b_url_link}][img]{b_img_link}[/img][/url]" aria-label="{b_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
<!-- END image_thumb -->


<!-- BEGIN image -->
    <div class="up_box_row"><div class="btitle">{b_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="{b_url_link}" aria-label="{b_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
    <div class="up_box_row"><div class="btitle">{b_bbc_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="[url={siteurl}][img]{b_url_link}[/img][/url]" aria-label="{b_bbc_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
    <div class="up_box_row"><div class="btitle">HTML</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="&lt;a href=&quot;{siteurl}&quot; target=&quot;_blank&quot; title=&quot;{siteurl}&quot;&gt;&lt;img src=&quot;{b_url_link}&quot; border=&quot;0&quot; alt=&quot;{b_url_link}&quot; /&gt;&lt;/a&gt;" aria-label="HTML"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
<!-- END image -->


<!-- BEGIN file -->
    <div class="up_box_row"><div class="btitle">{b_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="{b_url_link}" aria-label="{b_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
    <div class="up_box_row"><div class="btitle">{b_bbc_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="[url={b_url_link}]{b_url_link}[/url]" aria-label="{b_bbc_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
<!-- END file -->


<!-- BEGIN del_file_code -->
    <div class="up_box_row up_box_delete"><div class="btitle">{b_title}</div><div class="input-group"><input type="text" class="copy-field" readonly dir="ltr" value="{b_code_link}" aria-label="{b_title}"><button type="button" class="btn btn-icon" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button></div></div>
<!-- END del_file_code -->
