<!-- Powered by kleeja -->
<div id="content_index">

    <!-- form upload -->
    <form id="uploader" class="upload-form" action="{action}" method="post" enctype="multipart/form-data" data-filetypes="{config.siteurl}images/filetypes/">

        <div class="tabmain">
            <ul class="tabnav">
                <li class="tab">
                    <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>{lang.DOWNLOAD_F}
                </li>
                <li>
                    <a class="tab-link" href="{config.siteurl}(config.mod_writer?guide.html:go.php?go=guide)">
                        <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>{lang.GUIDE}
                    </a>
                </li>
            </ul>

            <div class="tabcon">

                <div id="upload-errors" class="notice notice-error" role="alert" hidden>
                    <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
                    <div class="notice-body" data-upload-errors></div>
                </div>

                <!-- drop zone, shown by js/script.js when the browser supports it -->
                <label class="dropzone" for="upload-picker" data-dropzone hidden>
                    <span class="dropzone-icon" aria-hidden="true"><svg class="icon"><use href="#i-upload"/></svg></span>
                    <span class="dropzone-title">{lang.DRAG_AND_DROP}</span>
                    <span class="dropzone-hint">{lang.OR_MANUAL_SELECT}</span>
                    <span class="dropzone-exts" data-upload-exts hidden></span>
                    <span class="dropzone-count" data-upload-count></span>
                    <input type="file" id="upload-picker" class="visually-hidden" multiple data-dropzone-input>
                </label>

                <ul class="upload-queue" data-upload-queue hidden></ul>

                <!-- the fields the server reads, one file each; the next one shows up once a file is chosen -->
                <div class="upload-fields" data-upload-fields>
                    <LOOP NAME="FILES_NUM_LOOP">
                    <div class="upload-field" style="{{show}}">
                        <input class="file" type="file" name="file_{{i}}_" data-number="{{i}}" aria-label="{lang.OPEN} {{i}}">
                    </div>
                    </LOOP>
                </div>

                <IF NAME="config.safe_code">
                <!-- verification code -->
                <div class="safe_code">
                    <label class="label" for="kleeja_code_answer">{lang.VERTY_CODE}</label>
                    <div class="captcha">
                        <img id="kleeja_img_captcha" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}">
                        <button type="button" class="btn btn-icon" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                        <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="kleeja_code_answer_help">
                    </div>
                    <p class="explain" id="kleeja_code_answer_help">{lang.NOTE_CODE}</p>
                </div>
                <!-- @end-verification-code -->
                </IF>

                <div class="upload-actions">
                    <p class="agree">{terms_msg}</p>
                    <button type="submit" id="submitr" name="submitr" value="{lang.DOWNLOAD_F}" class="btn btn-primary btn-lg">
                        <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>{lang.DOWNLOAD_F}
                    </button>
                </div>
            </div>
        </div>

    </form>
    <!-- @end-form-upload -->


    <!-- box loading, takes the place of the form while the files are uploading -->
    <div id="loadbox" hidden>
        <p class="waitloading" role="status">{lang.WAIT_LOADING}</p>
        <img class="loading-img" src="{STYLE_PATH}images/loading.gif" width="220" height="19" alt="">
        <div class="progress" role="progressbar" aria-label="{lang.WAIT_LOADING}" aria-valuemin="0" aria-valuemax="100" data-progress>
            <div class="progress-bar" data-progress-bar></div>
            <span class="progress-value" data-progress-value></span>
        </div>
    </div>
    <!-- @end-box-loading -->


    <!-- upload results and errors, js/script.js adds them here too after a background upload -->
    <div id="upload-results" class="upload-results" tabindex="-1" aria-live="polite"><IF NAME="info"><LOOP NAME="info"><IF LOOP="message_type==error">
        <div class="notice notice-error" role="alert"><img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt=""><div class="notice-body">{{message_content}}</div></div>
    <ELSE>
        <div class="up-result">{{message_content}}</div>
    </IF></LOOP></IF></div>

    <template id="tpl-upload-result"><div class="up-result" data-slot></div></template>
    <template id="tpl-upload-error"><div class="notice notice-error" role="alert"><img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt=""><div class="notice-body" data-slot></div></div></template>


    <IF NAME="welcome_msg">
    <!-- welcome message of the site -->
    <div class="welcome-msg">{welcome_msg}</div>
    </IF>


    <IF NAME="show_online">
    <!-- OnLine -->
    <ul class="online">
        <li class="onlineall">{lang.NUMBER_ONLINE} : <strong>{current_online_users}</strong></li>
        <LOOP NAME="show_names">
        <li class="name_users">{{name}}</li>
        </LOOP>
    </ul>
    <!-- @end-OnLine -->
    </IF>

</div>

<script>
    var UPLOAD_ALLOWED_EXTS = {js_allowed_extensions_types};
    var UPLOAD_ALLOWED_SIZES = {js_allowed_extensions_sizes};
</script>
