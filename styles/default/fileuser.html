<!-- Users Files template -->
<div id="content">

    <!-- title -->
    <h1 class="title"><IF NAME="user_himself">{lang.YOUR_FILEUSER}<ELSE>{title}</IF></h1>
    <!-- @end-title -->

    <IF NAME="user_name">
    <!-- box user name and all files -->
    <div id="boxfileuser">
        <div class="fu-box">
            <img src="{STYLE_PATH}images/imguser.png" width="64" height="64" alt="">
            <div class="fu-box-text">
                <div class="public">{lang.PUBLIC_USER_FILES}</div>
                <div class="uname">{user_name}</div>
            </div>
        </div>
        <div class="fu-box">
            <img src="{STYLE_PATH}images/boxfileuser.png" width="64" height="64" alt="">
            <div class="fu-box-text">
                <div class="public">{lang.ALL_FILES}</div>
                <div class="uname">{nums_rows}</div>
            </div>
        </div>
    </div>
    <!-- @end-box-user-name-and-all-files -->
    </IF>

    <IF NAME="user_himself">
    <form id="fileuser-form" name="c" action="{action}" method="post" data-confirm="{lang.ARE_YOU_SURE_DO_THIS}">
    </IF>

    <IF NAME="no_results">

        <!-- no files user -->
        <div class="nofiles">
            <img src="{STYLE_PATH}images/warning_nofile.png" width="128" height="128" alt="">
            <h2>{lang.NO_FILE_USER}</h2>
        </div>
        <!-- @end-no-files-user -->

    <ELSE>

        <IF NAME="user_himself">
        <div class="files-toolbar">
            <button type="button" class="link-button" data-check-all aria-pressed="false">[ {lang.CHECK_ALL} ]</button>
            <div class="files-toolbar-actions">
                <button type="submit" name="submit_files" value="{lang.DEL_SELECTED}" class="btn btn-danger" data-requires-selection>
                    <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>{lang.DEL_SELECTED}
                    <span class="btn-count" data-selected-count hidden></span>
                </button>
                <button type="submit" name="submit_all_files" value="{lang.DEL_ALL}" class="btn">{lang.DEL_ALL}</button>
            </div>
        </div>
        </IF>

        <!-- files of the user -->
        <div class="fileuser-thumbs">
            <LOOP NAME="arr">
            <div class="fu-tile" id="su[{{id}}]">
                <IF LOOP="is_image">
                <a class="fu-thumb" href="{{href}}" target="_blank" rel="noopener" title="{lang.FILEUPS}: {{uploads}}, {lang.FILESIZE}: {{size}}, {lang.FILEDATE}: {{time}}">
                    <img src="{{thumb_link}}" alt="{{name_file}}" loading="lazy" onerror="this.onerror=null;this.src='{config.siteurl}images/not_exists.jpg';">
                </a>
                <ELSE>
                <a class="fu-thumb fu-thumb-file" href="{{href}}" target="_blank" rel="noopener">
                    <img src="{{thumb_link}}" alt="" loading="lazy">
                </a>
                </IF>

                <div class="fu-info">
                    <a class="fu-name" href="{{href}}" target="_blank" rel="noopener" title="{{name_file}}" dir="auto">{{name_file}}</a>
                    <span>{lang.FILESIZE}: <bdi>{{size}}</bdi></span>
                    <span>{lang.FILEUPS}: {{uploads}}</span>
                    <span>{{time}}</span>
                </div>

                <IF NAME="user_himself">
                <label class="fu-check">
                    <input type="checkbox" class="file-select" id="del_{{id}}" name="del_{{id}}" value="{{id}}" aria-label="{{name_file}}">
                </label>
                </IF>
            </div>
            </LOOP>
        </div>
        <!-- end#fileuser-thumbs -->

    </IF>

    <IF NAME="page_nums">
    <!-- pagination -->
    <div class="pager">{page_nums}</div>
    <!-- @end-pagination -->
    </IF>

    <IF NAME="user_himself">
        {H_FORM_KEYS}
    </form>

    <!-- link user -->
    <fieldset id="filecplink">
        <legend>{lang.COPY_AND_GET_DUD}</legend>
        <div class="input-group">
            <input type="text" class="copy-field" readonly dir="ltr" value="{your_fileuser}" aria-label="{lang.COPY_AND_GET_DUD}">
            <button type="button" class="btn btn-primary" data-copy><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span>{lang.COPY}</span></button>
        </div>
    </fieldset>
    <!-- @end-link-user -->
    </IF>

</div>
<!-- @end-Users-Files -->
