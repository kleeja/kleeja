<!-- register template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{title}</h1>
    <!-- @end-title -->

    <IF NAME="ERRORS">
    <!-- msg, Alerts & Errors -->
    <div class="notice notice-error" role="alert">
        <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
        <ul class="notice-body">
            <LOOP NAME="ERRORS">
            <li>{%value%}</li>
            </LOOP>
        </ul>
    </div>
    <!-- @end-msg -->
    </IF>

    <div class="form-layout">
        <!-- form register -->
        <form class="form-main" action="{action}" method="post">

            <div class="field">
                <label for="lname">{lang.USERNAME}</label>
                <input class="input-username" type="text" id="lname" name="lname" value="{t_lname}" autocomplete="username" autofocus>
            </div>

            <div class="form-grid-2">
                <div class="field">
                    <label for="lpass">{lang.PASSWORD}</label>
                    <input class="input-password" type="password" id="lpass" name="lpass" value="{t_lpass}" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="lpass2">{lang.REPEAT_PASS}</label>
                    <input class="input-password" type="password" id="lpass2" name="lpass2" value="{t_lpass2}" autocomplete="new-password">
                </div>
            </div>

            <div class="field">
                <label for="lmail">{lang.EMAIL}</label>
                <input type="email" id="lmail" name="lmail" value="{t_lmail}" dir="ltr" autocomplete="email">
            </div>

            <IF NAME="config.enable_captcha==1">
            <!-- verification code -->
            <div class="safe_code">
                <label class="label" for="kleeja_code_answer">{lang.VERTY_CODE}</label>
                <div class="captcha">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}">
                    <button type="button" class="btn btn-icon" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" autocomplete="off" autocapitalize="off" spellcheck="false">
                </div>
                <p class="explain">{lang.NOTE_CODE}</p>
            </div>
            <!-- @end-verification-code -->
            </IF>

            {H_FORM_KEYS}

            <div class="form-actions">
                <button type="submit" name="submit" value="{lang.REGISTER}" class="btn btn-primary btn-lg">{lang.REGISTER}</button>
                <a href="{config.siteurl}(config.mod_writer?login.html:ucp.php?go=login)">{lang.LOGIN}</a>
            </div>
        </form>
        <!-- @end-form-register -->

        <img class="page-art" src="{STYLE_PATH}images/register.gif" width="128" height="128" alt="">
    </div>

</div>
<!-- @end-register-template -->
