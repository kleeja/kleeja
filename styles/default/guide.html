<!-- List of allowed file template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{lang.GUIDE_EXP}</h1>
    <!-- @end-title -->

    <IF NAME="ttgroups">
    <!-- the groups, one box each, gray and sky in turn -->
    <div class="guide-grid">
        <LOOP NAME="ttgroups">
            <IF LOOP="firstrow">
                <UNLESS LOOP="most_firstrow">
                    </tbody></table></div>
                </section>
                </UNLESS>

                <section class="box guide-group({{rando}}? guide-group-sky:)">
                    <h2 class="box-title({{rando}}? box-title-sky:)">{{group_name}}</h2>
                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">{lang.EXT}</th>
                                    <th scope="col" class="num">{lang.SIZE}</th>
                                </tr>
                            </thead>
                            <tbody>
            </IF>
                                <tr>
                                    <td class="ext-name">{{ext}}</td>
                                    <td class="num"><bdi>{{size}}</bdi></td>
                                </tr>
        </LOOP>
                    </tbody></table></div>
                </section>
    </div>
    <ELSE>
    <p class="notice"><img src="{STYLE_PATH}images/info.png" width="29" height="29" alt=""><span class="notice-body">{lang.NOTHING}</span></p>
    </IF>

</div>
<!-- @end-List-allowed-file-template -->
