<!-- Infos template -->
<div id="content_index">
    <div class="notice message" role="status">
        <img src="{STYLE_PATH}images/info.png" width="29" height="29" alt="">
        <div class="notice-body">
            <IF NAME="title"><h1 class="message-title">{title}</h1></IF>
            <div>{text}</div>
            <p class="message-actions"><a href="{config.siteurl}">{lang.RETURN_HOME}</a></p>
        </div>
    </div>
</div>
<!-- @end-Infos-template -->
