<!-- Profile template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{title}</h1>
    <!-- @end-title -->

    <IF NAME="ERRORS">
    <!-- msg, Alerts & Errors -->
    <div class="notice notice-error" role="alert">
        <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
        <ul class="notice-body">
            <LOOP NAME="ERRORS">
            <li>{%value%}</li>
            </LOOP>
        </ul>
    </div>
    <!-- @end-msg -->
    </IF>

    <IF NAME="data_forum">
    <!-- profile -->
    <form id="profile" action="{action}" method="post">

        <div class="profile-grid">
            <section class="box boxdata">
                <h2 class="box-title box-title-sky">{lang.EDIT_U_DATA}</h2>
                <div class="box-body">
                    <div class="field">
                        <label for="uname">{lang.USERNAME}</label>
                        <input class="input-username" type="text" id="uname" value="{name}" readonly>
                    </div>
                    <div class="field">
                        <label for="show_my_filecp">{lang.SHOW_MY_FILECP}</label>
                        <select id="show_my_filecp" name="show_my_filecp">
                            <option value="1" <IF NAME="show_my_filecp==1">selected</IF>>{lang.YES}</option>
                            <option value="0" <IF NAME="show_my_filecp==0">selected</IF>>{lang.NO}</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="box boxdata">
                <h2 class="box-title box-title-sky">{lang.EMAIL}</h2>
                <div class="box-body">
                    <div class="field">
                        <label for="pmail">{lang.EMAIL}</label>
                        <input type="email" id="pmail" name="pmail" value="{mail}" dir="ltr" autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="pppass_old">{lang.PASSWORD}</label>
                        <input class="input-password" type="password" id="pppass_old" name="pppass_old" value="{t_pppass_old}" autocomplete="current-password" aria-describedby="email-help">
                        <p class="explain" id="email-help">{lang.EMAIL_CHANGE_REQ_PASS}</p>
                    </div>
                </div>
            </section>

            <section class="box boxdata">
                <h2 class="box-title box-title-sky">{lang.PASS_ON_CHANGE}</h2>
                <div class="box-body">
                    <div class="field">
                        <label for="ppass_old">{lang.OLD}</label>
                        <input class="input-password" type="password" id="ppass_old" name="ppass_old" value="{t_ppass_old}" autocomplete="current-password">
                    </div>
                    <div class="field">
                        <label for="ppass_new">{lang.NEW}</label>
                        <input class="input-password" type="password" id="ppass_new" name="ppass_new" value="{t_ppass_new}" autocomplete="new-password">
                    </div>
                    <div class="field">
                        <label for="ppass_new2">{lang.NEW_AGAIN}</label>
                        <input class="input-password" type="password" id="ppass_new2" name="ppass_new2" value="{t_ppass_new2}" autocomplete="new-password">
                    </div>
                </div>
            </section>

            <section class="box boxdata avatar-box">
                <h2 class="box-title box-title-sky">{lang.EDIT_U_AVATER}</h2>
                <div class="box-body avatar-row">
                    <img src="{user_avatar}" width="92" height="92" alt="" onerror="this.onerror=null;this.src='{STYLE_PATH}images/user_avater.png';">
                    <p class="explain">{link_avater}</p>
                </div>
            </section>
        </div>

        {H_FORM_KEYS}

        <!-- button -->
        <div class="buttons_center">
            <button type="submit" name="submit_data" value="{lang.EDIT_U_DATA}" class="btn btn-primary btn-lg">{lang.EDIT_U_DATA}</button>
        </div>
        <!-- @end-button -->
    </form>
    <!-- @end-profile -->

    <ELSE>

    <!-- users of an integrated script, like phpBB, edit their data there -->
    <div class="buttons_center"><a class="btn btn-primary btn-lg" href="{goto_forum_link}">{lang.PFILE_4_FORUM}</a></div>

    </IF>

</div>
<!-- @end-Profile-template -->
