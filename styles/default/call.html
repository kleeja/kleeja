<!-- Contact Us template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{title}</h1>
    <!-- @end-title -->

    <IF NAME="ERRORS">
    <!-- msg, Alerts & Errors -->
    <div class="notice notice-error" role="alert">
        <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
        <ul class="notice-body">
            <LOOP NAME="ERRORS">
            <li>{%value%}</li>
            </LOOP>
        </ul>
    </div>
    <!-- @end-msg -->
    </IF>

    <div class="form-layout">
        <!-- form Contact Us -->
        <form class="form-main" action="{action}" method="post">

            <IF NAME="NOT_USER">
            <div class="form-grid-2">
                <div class="field">
                    <label for="cname">{lang.YOURNAME}</label>
                    <input class="input-username" type="text" id="cname" name="cname" value="{t_cname}" autocomplete="name">
                </div>
                <div class="field">
                    <label for="cmail">{lang.EMAIL}</label>
                    <input type="email" id="cmail" name="cmail" value="{t_cmail}" dir="ltr" autocomplete="email">
                </div>
            </div>
            </IF>

            <div class="field">
                <label for="ctext">{lang.TEXT}</label>
                <textarea id="ctext" name="ctext" rows="6">{t_ctext}</textarea>
            </div>

            <IF NAME="config.enable_captcha==1">
            <!-- verification code -->
            <div class="safe_code">
                <label class="label" for="kleeja_code_answer">{lang.VERTY_CODE}</label>
                <div class="captcha">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}">
                    <button type="button" class="btn btn-icon" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" autocomplete="off" autocapitalize="off" spellcheck="false">
                </div>
                <p class="explain">{lang.NOTE_CODE}</p>
            </div>
            <!-- @end-verification-code -->
            </IF>

            {H_FORM_KEYS}

            <div class="form-actions">
                <button type="submit" name="submit" value="{lang.SEND}" class="btn btn-primary btn-lg">{lang.SEND}</button>
            </div>
        </form>
        <!-- @end-form -->

        <img class="page-art" src="{STYLE_PATH}images/call.gif" width="128" height="128" alt="">
    </div>

</div>
<!-- @end-Contact-Us-template -->
