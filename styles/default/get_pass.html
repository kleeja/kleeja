<!-- Password Recovery Template -->
<div id="content">

    <!-- title -->
    <h1 class="title">{title}</h1>
    <!-- @end-title -->

    <IF NAME="ERRORS">
    <!-- msg, Alerts & Errors -->
    <div class="notice notice-error" role="alert">
        <img src="{STYLE_PATH}images/err.gif" width="29" height="29" alt="">
        <ul class="notice-body">
            <LOOP NAME="ERRORS">
            <li>{%value%}</li>
            </LOOP>
        </ul>
    </div>
    <!-- @end-msg -->
    </IF>

    <div class="form-layout">
        <!-- form -->
        <form class="form-main" action="{action}" method="post">

            <p class="intro">{lang.E_GET_LOSTPASS}</p>

            <div class="field">
                <label for="rmail">{lang.EMAIL}</label>
                <input type="email" id="rmail" name="rmail" value="{t_rmail}" dir="ltr" autocomplete="email" autofocus>
            </div>

            <IF NAME="config.enable_captcha==1">
            <!-- verification code -->
            <div class="safe_code">
                <label class="label" for="kleeja_code_answer">{lang.VERTY_CODE}</label>
                <div class="captcha">
                    <img id="kleeja_img_captcha" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}">
                    <button type="button" class="btn btn-icon" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" data-captcha-refresh="{captcha_file_path}"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                    <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" autocomplete="off" autocapitalize="off" spellcheck="false">
                </div>
                <p class="explain">{lang.NOTE_CODE}</p>
            </div>
            <!-- @end-verification-code -->
            </IF>

            {H_FORM_KEYS}

            <div class="form-actions">
                <button type="submit" name="submit" value="{lang.GET_LOSTPASS}" class="btn btn-primary btn-lg">{lang.GET_LOSTPASS}</button>
                <a href="{config.siteurl}(config.mod_writer?login.html:ucp.php?go=login)">{lang.LOGIN}</a>
            </div>
        </form>
        <!-- @end-form -->

        <img class="page-art" src="{STYLE_PATH}images/get_password.gif" width="100" height="100" alt="">
    </div>

</div>
<!-- @end-Password-Recovery-Template -->
