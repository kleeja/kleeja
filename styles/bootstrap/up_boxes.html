<!--
    Upload result boxes, filled by get_up_tpl_box() in includes/functions_display.php
    Line breaks and the indent after them are removed before use, so keep every tag on one line.
    Only {b_*}, {siteurl} and {sitename} are replaced here, lang variables are not.
-->

<!-- BEGIN image_thumb -->
    <div class="up-box-thumb text-center mb-3"><a target="_blank" rel="noopener" href="{b_url_link}"><img src="{b_img_link}" alt="" class="img-thumbnail"></a></div>
    <div class="up-box mb-3">
        <div class="up-box-label">{b_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="[url={b_url_link}][img]{b_img_link}[/img][/url]" aria-label="{b_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
<!-- END image_thumb -->


<!-- BEGIN image -->
    <div class="up-box mb-3">
        <div class="up-box-label">{b_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="{b_url_link}" aria-label="{b_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
    <div class="up-box mb-3">
        <div class="up-box-label">{b_bbc_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="[url={siteurl}][img]{b_url_link}[/img][/url]" aria-label="{b_bbc_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
    <div class="up-box mb-3">
        <div class="up-box-label">HTML</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="&lt;a href=&quot;{siteurl}&quot; target=&quot;_blank&quot; title=&quot;{siteurl}&quot;&gt;&lt;img src=&quot;{b_url_link}&quot; border=&quot;0&quot; alt=&quot;{b_url_link}&quot; /&gt;&lt;/a&gt;" aria-label="HTML" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
<!-- END image -->


<!-- BEGIN file -->
    <div class="up-box mb-3">
        <div class="up-box-label">{b_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="{b_url_link}" aria-label="{b_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
    <div class="up-box mb-3">
        <div class="up-box-label">{b_bbc_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="[url={b_url_link}]{b_url_link}[/url]" aria-label="{b_bbc_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
<!-- END file -->


<!-- BEGIN del_file_code -->
    <div class="up-box up-box-delete mb-3">
        <div class="up-box-label text-danger-emphasis">{b_title}</div>
        <div class="input-group input-group-sm"><input type="text" class="form-control font-monospace" readonly value="{b_code_link}" aria-label="{b_title}" onfocus="this.select();"><button type="button" class="btn btn-outline-secondary" data-copy><i class="fa-regular fa-copy"></i></button></div>
    </div>
<!-- END del_file_code -->
