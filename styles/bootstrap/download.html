<div class="row justify-content-center">
    <div class="col-lg-10 col-xl-9">
        <div class="card shadow-sm overflow-hidden">
            <div class="row g-0">

                <!-- file information -->
                <div class="col-md-7 p-4 p-lg-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <span class="icon-box rounded-3 bg-primary-subtle text-primary-emphasis"><i class="fa-regular fa-file-lines"></i></span>
                        <div class="overflow-hidden">
                            <h1 class="h4 fw-bold mb-1 text-break">{name}</h1>
                            <div class="d-flex flex-wrap align-items-center gap-2 small text-body-secondary">
                                <span class="badge bg-secondary-subtle text-secondary-emphasis text-uppercase">{type}</span>
                                <bdi>{size}</bdi>
                            </div>
                        </div>
                    </div>

                    <ul class="list-group list-group-flush file-details">
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0">
                            <span class="text-body-secondary"><i class="fa-regular fa-file fa-fw me-2 opacity-75"></i>{lang.FILETYPE}</span>
                            <span class="fw-medium text-end">{type}</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0">
                            <span class="text-body-secondary"><i class="fa-solid fa-weight-hanging fa-fw me-2 opacity-75"></i>{lang.FILESIZE}</span>
                            <span class="fw-medium text-end"><bdi>{size}</bdi></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0">
                            <span class="text-body-secondary"><i class="fa-regular fa-calendar fa-fw me-2 opacity-75"></i>{lang.FILEDATE}</span>
                            <span class="fw-medium text-end">{time}</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0">
                            <span class="text-body-secondary"><i class="fa-solid fa-download fa-fw me-2 opacity-75"></i>{lang.FILEUPS}</span>
                            <span class="fw-medium text-end">{uploads}</span>
                        </li>
                        <IF NAME="fusername">
                        <li class="list-group-item d-flex justify-content-between gap-3 px-0">
                            <span class="text-body-secondary"><i class="fa-regular fa-user fa-fw me-2 opacity-75"></i>{lang.USERNAME}</span>
                            <a href="{userfolder}" class="fw-medium text-end text-decoration-none">{fusername}</a>
                        </li>
                        </IF>
                    </ul>
                </div>

                <!-- download box -->
                <div class="col-md-5 bg-body-tertiary p-4 d-flex flex-column justify-content-center text-center">
                    <span class="icon-box icon-box-lg rounded-circle bg-success-subtle text-success-emphasis mx-auto mb-3"><i class="fa-solid fa-check"></i></span>
                    <h2 class="h5 fw-semibold mb-4">{lang.FILE_FOUNDED}</h2>

                    <div id="download-wait">
                        <button type="button" class="btn btn-primary btn-lg w-100" disabled>
                            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>{lang.WAIT} <span id="download-countdown" class="fw-bold">{seconds_w}</span>
                        </button>
                        <div class="progress mt-3" role="progressbar" aria-label="{lang.WAIT}" style="height: .375rem">
                            <div class="progress-bar" id="download-progress" style="width: 0%"></div>
                        </div>
                    </div>

                    <a href="{url_file}" id="download-button" class="btn btn-primary btn-lg w-100 d-none" target="_blank">
                        <i class="fa-solid fa-download me-2"></i><span class="text-nowrap">{lang.CLICK_DOWN}</span>
                    </a>

                    <noscript>
                        <div class="alert alert-warning small mt-3 mb-0">{lang.JS_MUST_ON}</div>
                    </noscript>
                </div>
            </div>

            <div class="card-footer bg-body text-center small py-3">
                <a href="{REPORT}" rel="nofollow" class="link-danger link-underline-opacity-0 link-underline-opacity-75-hover">
                    <i class="fa-regular fa-flag me-1"></i>{lang.FILEREPORT}
                </a>
            </div>
        </div>
    </div>
</div>


<script>
    (function () {
        var total = parseInt('{seconds_w}', 10) || 0;
        var seconds = total;
        var counter = document.getElementById('download-countdown');
        var progress = document.getElementById('download-progress');
        var wait = document.getElementById('download-wait');
        var button = document.getElementById('download-button');

        function tick() {
            if (seconds > 0) {
                counter.textContent = seconds;
                progress.style.width = ((total - seconds) / total) * 100 + '%';
                seconds--;
                setTimeout(tick, 1000);

                return;
            }

            wait.classList.add('d-none');
            button.classList.remove('d-none');
        }

        tick();
    })();
</script>
