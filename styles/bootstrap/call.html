
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="form-icon bg-primary-subtle text-primary-emphasis flex-shrink-0"><i class="fa-solid fa-envelope"></i></div>
                    <h1 class="h4 mb-0">{title}</h1>
                </div>


                <!-- error messages -->
                <IF NAME="ERRORS">
                <div class="alert alert-danger small" role="alert">
                    <ul class="mb-0 ps-3">
                        <LOOP NAME="ERRORS">
                        <li>{%value%}</li>
                        </LOOP>
                    </ul>
                </div>
                </IF>


                <form action="{action}" method="post">

                    <IF NAME="NOT_USER">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="cname" class="form-label">{lang.YOURNAME}</label>
                            <input type="text" class="form-control" id="cname" name="cname" value="{t_cname}" autocomplete="name">
                        </div>
                        <div class="col-md-6">
                            <label for="cmail" class="form-label">{lang.EMAIL}</label>
                            <input type="email" class="form-control" id="cmail" name="cmail" value="{t_cmail}" dir="ltr" autocomplete="email">
                        </div>
                    </div>
                    </IF>

                    <div class="mb-3">
                        <label for="ctext" class="form-label">{lang.TEXT}</label>
                        <textarea class="form-control" id="ctext" name="ctext" rows="5">{t_ctext}</textarea>
                    </div>


                    <!-- verification code -->
                    <IF NAME="config.enable_captcha==1">
                    <div class="mb-3">
                        <label for="kleeja_code_answer" class="form-label">{lang.VERTY_CODE}</label>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <img id="kleeja_img_captcha" class="captcha-img rounded border" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');">
                            <button type="button" class="btn btn-outline-secondary" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                            <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" class="form-control captcha-input" autocomplete="off" aria-describedby="kleeja_code_answer_help">
                        </div>
                        <div id="kleeja_code_answer_help" class="form-text">{lang.NOTE_CODE}</div>
                    </div>
                    </IF>

                    {H_FORM_KEYS}

                    <button type="submit" name="submit" value="{lang.SEND}" class="btn btn-primary px-4 mt-2">
                        <i class="fa-solid fa-paper-plane me-2"></i>{lang.SEND}
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
