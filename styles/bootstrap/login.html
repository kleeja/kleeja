<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <span class="icon-box icon-box-lg rounded-circle bg-primary-subtle text-primary-emphasis mb-3"><i class="fa-solid fa-right-to-bracket icon-dir"></i></span>
                    <h1 class="h3 fw-bold mb-1">{title}</h1>
                    <p class="text-body-secondary mb-0">{lang.USER_LOGIN}</p>
                </div>


                <!-- error messages -->
                <IF NAME="ERRORS">
                <div class="alert alert-danger small" role="alert">
                    <ul class="mb-0 ps-3">
                        <LOOP NAME="ERRORS">
                        <li>{%value%}</li>
                        </LOOP>
                    </ul>
                </div>
                </IF>


                <form action="{action}" method="post" name="login_form">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="lname" name="lname" value="{t_lname}" placeholder="{lang.USERNAME}" autocomplete="username">
                        <label for="lname">{lang.USERNAME}</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="lpass" name="lpass" value="{t_lpass}" placeholder="{lang.PASSWORD}" autocomplete="current-password">
                        <label for="lpass">{lang.PASSWORD}</label>
                    </div>

                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
                        <div class="form-check mb-0">
                            <input type="checkbox" class="form-check-input" id="remme" name="remme" value="31536000" checked aria-describedby="remme_help">
                            <label class="form-check-label" for="remme">{lang.REMME}</label>
                            <span id="remme_help" class="text-body-secondary ms-1" tabindex="0" data-bs-toggle="tooltip" data-bs-title="{lang.REMME_EXP}" aria-label="{lang.REMME_EXP}"><i class="fa-regular fa-circle-question"></i></span>
                        </div>
                        <a href="{forget_pass_link}" class="small text-decoration-none">{lang.LOSS_PASSWORD}</a>
                    </div>


                    <!-- verification code -->
                    <IF NAME="config.enable_captcha==1">
                    <div class="mb-4">
                        <label for="kleeja_code_answer" class="form-label">{lang.VERTY_CODE}</label>
                        <div class="input-group">
                            <span class="input-group-text p-0 overflow-hidden"><img id="kleeja_img_captcha" class="captcha-img" src="{captcha_file_path}" width="160" height="38" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"></span>
                            <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" class="form-control" dir="ltr" autocomplete="off" aria-describedby="kleeja_code_answer_help">
                            <button type="button" class="btn btn-outline-secondary" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                        </div>
                        <div id="kleeja_code_answer_help" class="form-text">{lang.NOTE_CODE}</div>
                    </div>
                    </IF>

                    {H_FORM_KEYS}

                    <button type="submit" name="submit" value="{lang.LOGIN}" class="btn btn-primary btn-lg w-100">{lang.LOGIN}</button>

                    <IF NAME="config.register">
                    <div class="d-flex align-items-center gap-3 my-4 small text-body-secondary">
                        <hr class="flex-grow-1 my-0"><span>{lang.OR}</span><hr class="flex-grow-1 my-0">
                    </div>
                    <a href="{config.siteurl}(config.mod_writer?register.html:ucp.php?go=register)" class="btn btn-outline-secondary btn-lg w-100">{lang.REGISTER}</a>
                    </IF>
                </form>

            </div>
        </div>
    </div>
</div>
