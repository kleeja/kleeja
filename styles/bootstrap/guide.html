<div class="d-flex align-items-center gap-3 mb-4">
    <span class="icon-box rounded-3 bg-primary-subtle text-primary-emphasis"><i class="fa-solid fa-file-circle-check"></i></span>
    <div>
        <h1 class="h3 fw-bold mb-0">{title}</h1>
        <p class="text-body-secondary mb-0">{lang.GUIDE_EXP}</p>
    </div>
</div>


<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <LOOP NAME="ttgroups">

        <IF LOOP="firstrow">

            <UNLESS LOOP="most_firstrow">
                    </ul>
                </div>
            </div>
            </UNLESS>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-body py-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-user-group text-primary"></i>
                        <h2 class="h6 fw-semibold mb-0">{{group_name}}</h2>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between small fw-semibold text-body-secondary bg-body-tertiary">
                            <span>{lang.EXT}</span>
                            <span>{lang.SIZE}</span>
                        </li>
        </IF>

                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary-subtle text-primary-emphasis font-monospace fw-medium" dir="ltr">.{{ext}}</span>
                            <span class="small text-body-secondary"><bdi>{{size}}</bdi></span>
                        </li>
    </LOOP>

    <IF NAME="ttgroups">
                    </ul>
                </div>
            </div>
    </IF>

</div>
