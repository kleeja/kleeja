
<div class="mb-4">
    <h1 class="h3 mb-1">{title}</h1>
    <p class="text-body-secondary mb-0">{lang.GUIDE_EXP}</p>
</div>


<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

    <LOOP NAME="ttgroups">

        <IF LOOP="firstrow">

            <UNLESS LOOP="most_firstrow">
                    </ul>
                </div>
            </div>
            </UNLESS>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-body py-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-users text-primary"></i>
                        <h2 class="h6 mb-0">{{group_name}}</h2>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between small text-body-secondary bg-body-tertiary">
                            <span>{lang.EXT}</span>
                            <span>{lang.SIZE}</span>
                        </li>
        </IF>

                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="badge bg-secondary-subtle text-secondary-emphasis font-monospace">{{ext}}</span>
                            <span class="small text-body-secondary">{{size}}</span>
                        </li>
    </LOOP>

    <IF NAME="ttgroups">
                    </ul>
                </div>
            </div>
    </IF>

</div>
