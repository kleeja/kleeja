
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="form-icon bg-primary-subtle text-primary-emphasis mx-auto mb-3"><i class="fa-solid fa-key"></i></div>
                    <h1 class="h4 mb-1">{title}</h1>
                    <p class="small text-body-secondary mb-0">{lang.E_GET_LOSTPASS}</p>
                </div>


                <!-- error messages -->
                <IF NAME="ERRORS">
                <div class="alert alert-danger small" role="alert">
                    <ul class="mb-0 ps-3">
                        <LOOP NAME="ERRORS">
                        <li>{%value%}</li>
                        </LOOP>
                    </ul>
                </div>
                </IF>


                <form action="{action}" method="post">

                    <div class="mb-3">
                        <label for="rmail" class="form-label">{lang.EMAIL}</label>
                        <input type="email" class="form-control" id="rmail" name="rmail" value="{t_rmail}" dir="ltr" autocomplete="email">
                    </div>


                    <!-- verification code -->
                    <IF NAME="config.enable_captcha==1">
                    <div class="mb-3">
                        <label for="kleeja_code_answer" class="form-label">{lang.VERTY_CODE}</label>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <img id="kleeja_img_captcha" class="captcha-img rounded border" src="{captcha_file_path}" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');">
                            <button type="button" class="btn btn-outline-secondary" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                            <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" class="form-control captcha-input" autocomplete="off" aria-describedby="kleeja_code_answer_help">
                        </div>
                        <div id="kleeja_code_answer_help" class="form-text">{lang.NOTE_CODE}</div>
                    </div>
                    </IF>

                    {H_FORM_KEYS}

                    <button type="submit" name="submit" value="{lang.GET_LOSTPASS}" class="btn btn-primary btn-lg w-100 mt-2">{lang.GET_LOSTPASS}</button>
                </form>

            </div>
        </div>
    </div>
</div>
