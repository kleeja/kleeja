
<div class="mb-4">
    <h1 class="h3 mb-1">{title}</h1>
    <p class="text-body-secondary mb-0">{lang.LAST_1_H}</p>
</div>


<div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-primary-subtle text-primary-emphasis"><i class="fa-solid fa-file-arrow-up"></i></div>
                <div>
                    <div class="small text-body-secondary">{lang.FILES_ST}</div>
                    <div class="fs-5 fw-semibold">{files_st} {lang.FILE} {lang.AND} {imgs_st} {lang.IMAGE}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-warning-subtle text-warning-emphasis"><i class="fa-solid fa-hard-drive"></i></div>
                <div>
                    <div class="small text-body-secondary">{lang.SIZES_ST}</div>
                    <div class="fs-5 fw-semibold"><bdi>{sizes_st}</bdi></div>
                </div>
            </div>
        </div>
    </div>

    <IF NAME="config.user_system==1">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-success-subtle text-success-emphasis"><i class="fa-solid fa-users"></i></div>
                <div>
                    <div class="small text-body-secondary">{lang.USERS_ST}</div>
                    <div class="fs-5 fw-semibold">{users_st} {lang.USER}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-info-subtle text-info-emphasis"><i class="fa-solid fa-user-plus"></i></div>
                <div class="overflow-hidden">
                    <div class="small text-body-secondary">{lang.LAST_REG}</div>
                    <div class="fs-5 fw-semibold text-truncate">{lst_reg}</div>
                </div>
            </div>
        </div>
    </div>

    </IF>

    <IF NAME="lst_dl_st">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-danger-subtle text-danger-emphasis"><i class="fa-solid fa-trash-can"></i></div>
                <div>
                    <div class="small text-body-secondary">{lang.LSTDELST}</div>
                    <div class="fw-semibold">{lst_dl_st}</div>
                </div>
            </div>
        </div>
    </div>

    </IF>

    <IF NAME="config.allow_online==1">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
                <div class="stat-icon bg-secondary-subtle text-secondary-emphasis"><i class="fa-solid fa-user-clock"></i></div>
                <div>
                    <div class="small text-body-secondary">{lang.MOST_EVER_ONLINE}</div>
                    <div class="fw-semibold"><span class="fs-5">{most_online}</span> <span class="text-body-secondary fw-normal">{lang.ON} {on_muoe}</span></div>
                </div>
            </div>
        </div>
    </div>

    </IF>

</div>
