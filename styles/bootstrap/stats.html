<div class="d-flex align-items-center gap-3 mb-4">
    <span class="icon-box rounded-3 bg-primary-subtle text-primary-emphasis"><i class="fa-solid fa-chart-simple"></i></span>
    <div>
        <h1 class="h3 fw-bold mb-0">{title}</h1>
        <p class="text-body-secondary mb-0">{lang.LAST_1_H}</p>
    </div>
</div>


<div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-primary-subtle text-primary-emphasis"><i class="fa-solid fa-file-arrow-up"></i></span>
                <div>
                    <div class="small text-body-secondary">{lang.FILES_ST}</div>
                    <div class="fs-5 fw-bold">{files_st} {lang.FILE} <span class="fw-normal text-body-secondary">{lang.AND}</span> {imgs_st} {lang.IMAGE}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-warning-subtle text-warning-emphasis"><i class="fa-solid fa-hard-drive"></i></span>
                <div>
                    <div class="small text-body-secondary">{lang.SIZES_ST}</div>
                    <div class="fs-5 fw-bold"><bdi>{sizes_st}</bdi></div>
                </div>
            </div>
        </div>
    </div>

    <IF NAME="config.user_system==1">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-success-subtle text-success-emphasis"><i class="fa-solid fa-users"></i></span>
                <div>
                    <div class="small text-body-secondary">{lang.USERS_ST}</div>
                    <div class="fs-5 fw-bold">{users_st} {lang.USER}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-info-subtle text-info-emphasis"><i class="fa-solid fa-user-plus"></i></span>
                <div class="overflow-hidden">
                    <div class="small text-body-secondary">{lang.LAST_REG}</div>
                    <div class="fs-5 fw-bold text-truncate">{lst_reg}</div>
                </div>
            </div>
        </div>
    </div>

    </IF>

    <IF NAME="lst_dl_st">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-danger-subtle text-danger-emphasis"><i class="fa-regular fa-trash-can"></i></span>
                <div>
                    <div class="small text-body-secondary">{lang.LSTDELST}</div>
                    <div class="fw-bold">{lst_dl_st}</div>
                </div>
            </div>
        </div>
    </div>

    </IF>

    <IF NAME="config.allow_online==1">

    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <span class="icon-box rounded-3 bg-secondary-subtle text-secondary-emphasis"><i class="fa-solid fa-user-clock"></i></span>
                <div>
                    <div class="small text-body-secondary">{lang.MOST_EVER_ONLINE}</div>
                    <div class="fw-bold"><span class="fs-5">{most_online}</span> <span class="small text-body-secondary fw-normal">{lang.ON} {on_muoe}</span></div>
                </div>
            </div>
        </div>
    </div>

    </IF>

</div>
