<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">

        <div class="d-flex align-items-center gap-3 mb-4">
            <span class="icon-box rounded-3 bg-danger-subtle text-danger-emphasis"><i class="fa-regular fa-flag"></i></span>
            <h1 class="h3 fw-bold mb-0">{title}</h1>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">

                <!-- error messages -->
                <IF NAME="ERRORS">
                <div class="alert alert-danger small" role="alert">
                    <ul class="mb-0 ps-3">
                        <LOOP NAME="ERRORS">
                        <li>{%value%}</li>
                        </LOOP>
                    </ul>
                </div>
                </IF>


                <form action="{action}" method="post">

                    <IF NAME="NOT_USER">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="rname" class="form-label">{lang.YOURNAME}</label>
                            <input type="text" class="form-control" id="rname" name="rname" value="{t_rname}" autocomplete="name">
                        </div>
                        <div class="col-md-6">
                            <label for="rmail" class="form-label">{lang.EMAIL}</label>
                            <input type="email" class="form-control" id="rmail" name="rmail" value="{t_rmail}" dir="ltr" autocomplete="email">
                        </div>
                    </div>
                    </IF>

                    <IF NAME="id_d">
                    <div class="mb-3">
                        <label for="rurl" class="form-label">{lang.FILENAME}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-regular fa-file"></i></span>
                            <input type="text" class="form-control bg-body-tertiary" id="rurl" name="rurl" value="{filename_for_show}" readonly>
                        </div>
                    </div>
                    <ELSE>
                    <div class="mb-3">
                        <label for="surl" class="form-label">{lang.URL_F_FILE}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-link"></i></span>
                            <input type="text" class="form-control" id="surl" name="surl" value="{s_url}" dir="ltr">
                        </div>
                    </div>
                    </IF>

                    <div class="mb-3">
                        <label for="rtext" class="form-label">{lang.REASON}</label>
                        <textarea class="form-control" id="rtext" name="rtext" rows="5">{t_rtext}</textarea>
                    </div>


                    <!-- verification code -->
                    <IF NAME="config.enable_captcha==1">
                    <div class="mb-3">
                        <label for="kleeja_code_answer" class="form-label">{lang.VERTY_CODE}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body p-1"><img id="kleeja_img_captcha" class="captcha-img rounded-1" src="{captcha_file_path}" width="150" height="25" alt="{lang.REFRESH_CAPTCHA}" title="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"></span>
                            <input type="text" name="kleeja_code_answer" id="kleeja_code_answer" class="form-control" dir="ltr" autocomplete="off" aria-describedby="kleeja_code_answer_help">
                            <button type="button" class="btn btn-outline-secondary" title="{lang.REFRESH_CAPTCHA}" aria-label="{lang.REFRESH_CAPTCHA}" onclick="update_kleeja_captcha('{captcha_file_path}', 'kleeja_code_answer');"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                        </div>
                        <div id="kleeja_code_answer_help" class="form-text">{lang.NOTE_CODE}</div>
                    </div>
                    </IF>

                    <IF NAME="id_d">
                    <input type="hidden" name="rid" value="{id_d}">
                    </IF>

                    {H_FORM_KEYS}

                    <div class="d-flex justify-content-end border-top pt-4 mt-4">
                        <button type="submit" name="submit" value="{lang.REPORT}" class="btn btn-danger btn-lg px-4">
                            <i class="fa-solid fa-flag me-2"></i>{lang.REPORT}
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
