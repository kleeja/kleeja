        </div>
    </div>
</main>

</footer>

<script src="../includes/static_shared_files/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var all = function (selector) {
            return Array.prototype.slice.call(document.querySelectorAll(selector));
        };

        // show the state of a field, bootstrap style. an error shows up only after the user leaves
        // the field or presses next, so it does not complain while typing, then it follows every key
        var validate = function (field) {
            var valid = field.disabled || field.checkValidity();
            var touched = field.hasAttribute('data-kj-touched');
            var invalid = !valid && touched;

            field.classList.toggle('is-invalid', invalid);
            field.classList.toggle(
                'is-valid',
                valid && !field.disabled && field.value !== '' && (touched || field.hasAttribute('data-kj-dirty'))
            );

            if (invalid) {
                field.setAttribute('aria-invalid', 'true');
            } else {
                field.removeAttribute('aria-invalid');
            }

            return valid;
        };

        // a field that has to match another one, like the password confirmation
        all('[data-kj-match]').forEach(function (input) {
            var other = document.querySelector(input.getAttribute('data-kj-match'));
            var feedback = input.parentNode.querySelector('.invalid-feedback');
            var requiredMessage = feedback.textContent;
            var sync = function () {
                var mismatch = input.value !== '' && input.value !== other.value;
                input.setCustomValidity(mismatch ? 'mismatch' : '');
                feedback.textContent = mismatch ? input.getAttribute('data-kj-match-message') : requiredMessage;
                validate(input);
            };

            input.addEventListener('input', sync);
            other.addEventListener('input', sync);
            input.form.addEventListener('submit', sync);
        });

        // live forms validation
        all('form.needs-validation').forEach(function (form) {
            var fields = Array.prototype.slice.call(form.querySelectorAll('[required], [pattern]'));

            fields.forEach(function (field) {
                field.addEventListener('input', function () {
                    field.setAttribute('data-kj-dirty', '');
                    validate(field);
                });

                field.addEventListener('blur', function () {
                    if (field.hasAttribute('data-kj-dirty')) {
                        field.setAttribute('data-kj-touched', '');
                        validate(field);
                    }
                });
            });

            form.addEventListener('submit', function (event) {
                fields.forEach(function (field) {
                    field.setAttribute('data-kj-touched', '');
                    validate(field);
                });

                if (!form.checkValidity()) {
                    event.preventDefault();

                    var first = form.querySelector('.is-invalid');

                    if (first) {
                        first.focus();
                    }
                }
            });
        });

        // show or hide a password
        all('[data-kj-toggle-password]').forEach(function (button) {
            var input = document.querySelector(button.getAttribute('data-kj-toggle-password'));
            var icon = button.querySelector('.kj-icon');

            button.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.setAttribute('aria-pressed', show ? 'true' : 'false');
                icon.classList.toggle('fa-eye', !show);
                icon.classList.toggle('fa-eye-slash', show);
            });
        });

        // a checkbox that has to be checked before continuing
        all('[data-kj-enables]').forEach(function (checkbox) {
            var target = document.querySelector(checkbox.getAttribute('data-kj-enables'));
            var sync = function () {
                target.disabled = !checkbox.checked;
            };

            checkbox.addEventListener('change', sync);
            sync();
        });

        // copy a value to another empty field, like the site email to the admin email
        all('[data-kj-copy-to]').forEach(function (input) {
            var target = document.querySelector(input.getAttribute('data-kj-copy-to'));
            var copied = target.value;

            input.addEventListener('input', function () {
                if (target.value === copied) {
                    target.value = copied = input.value;
                    target.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
        });

        // show an example of the selected option
        all('select[data-kj-example]').forEach(function (select) {
            var example = document.querySelector(select.getAttribute('data-kj-example'));
            var sync = function () {
                example.textContent = select.options[select.selectedIndex].getAttribute('data-example');
            };

            select.addEventListener('change', sync);
            sync();
        });

        // sqlite needs no server, user or password
        var dbType = document.getElementById('db_type');

        if (dbType) {
            var syncDbType = function () {
                all('[data-kj-mysql-only]').forEach(function (input) {
                    input.disabled = dbType.value === 'sqlite';
                    validate(input);
                });
            };

            dbType.addEventListener('change', syncDbType);
            syncDbType();
        }

        // light or dark theme, remembered for the next pages
        var themeToggle = document.getElementById('kj_theme');

        if (themeToggle) {
            var root = document.documentElement;
            var syncTheme = function () {
                themeToggle.setAttribute('aria-pressed', root.getAttribute('data-bs-theme') === 'dark' ? 'true' : 'false');
            };

            themeToggle.addEventListener('click', function () {
                var theme = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-bs-theme', theme);
                syncTheme();

                try {
                    window.localStorage.setItem('kj-install-theme', theme);
                } catch (e) {}
            });

            syncTheme();
        }

        // go to a link after a while
        all('[data-kj-redirect]').forEach(function (link) {
            window.setTimeout(function () {
                window.location.href = link.href;
            }, parseInt(link.getAttribute('data-kj-redirect'), 10));
        });
    })();
</script>
</body>
</html>
